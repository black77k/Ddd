<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تنزيل وسائط تويتر</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#16181c; --muted:#5b6470; --line:#dde1e6; --accent:#1763d6; --bad:#b42318; --ok:#067647; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101215; --card:#181b20; --text:#eceff3; --muted:#9aa4b2; --line:#2a2f37; --accent:#5b9bff; --bad:#ff8a80; --ok:#6ee7a8; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, "Segoe UI", Tahoma, sans-serif; line-height:1.6; }
  main { max-width:640px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin-bottom:4px; }
  input, select, button { font:inherit; width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  input[dir=ltr] { text-align:left; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; margin-top:16px; font-weight:600; }
  button:disabled { opacity:.55; cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .msg { margin:0; }
  .err { color:var(--bad); } .ok { color:var(--ok); }
  .warn { border-color:var(--bad); color:var(--bad); }
  progress { width:100%; height:8px; margin-top:8px; }
  ul { list-style:none; padding:0; margin:12px 0 0; max-height:320px; overflow:auto; }
  li { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid var(--line); font-size:.9rem; }
  li a { direction:ltr; overflow-wrap:anywhere; color:var(--accent); }
  .zip { display:block; text-align:center; text-decoration:none; background:var(--ok); color:#fff; padding:10px; border-radius:8px; margin-top:12px; font-weight:600; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>تنزيل صور وفيديوهات حساب تويتر</h1>

  <div id="warn" class="card warn" hidden></div>

  <form id="form" class="card" autocomplete="off">
    <label for="username">يوزر الحساب (أو رابطه)</label>
    <input id="username" dir="ltr" placeholder="@username" required maxlength="100" autocapitalize="none" spellcheck="false">
    <div class="row">
      <div>
        <label for="kind">النوع</label>
        <select id="kind">
          <option value="all">صور وفيديوهات</option>
          <option value="photos">صور فقط</option>
          <option value="videos">فيديوهات فقط</option>
        </select>
      </div>
      <div>
        <label for="limit">أقصى عدد ملفات</label>
        <input id="limit" type="number" min="1" max="200" value="50" inputmode="numeric">
      </div>
    </div>
    <button id="go" type="submit">ابدأ التنزيل</button>
  </form>

  <section id="result" class="card" hidden aria-live="polite">
    <p id="status" class="msg"></p>
    <progress id="bar" hidden></progress>
    <a id="zip" class="zip" hidden>تحميل الكل (ZIP)</a>
    <ul id="files"></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let timer = null, failures = 0;

function fmtSize(b) {
  if (b > 1048576) return (b / 1048576).toFixed(1) + " MB";
  return Math.max(1, Math.round(b / 1024)) + " KB";
}

async function health() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("limit").max = h.max_items;
    const problems = [];
    if (!h.gallery_dl) problems.push("المكتبة gallery-dl غير مثبتة على الخادم.");
    if (!h.auth) problems.push("لم يتم إعداد تسجيل الدخول (cookies.txt أو TWITTER_AUTH_TOKEN). تويتر غالباً سيرفض الطلبات بدونه.");
    if (problems.length) { $("warn").textContent = problems.join(" "); $("warn").hidden = false; }
  } catch (_) {}
}

function show(msg, cls) {
  $("result").hidden = false;
  $("status").textContent = msg;
  $("status").className = "msg " + (cls || "");
}

function finish() {
  clearTimeout(timer);
  $("go").disabled = false;
  $("bar").hidden = true;
}

async function poll(id) {
  try {
    const r = await fetch("/api/jobs/" + id);
    if (r.status === 404) { show("انتهت صلاحية العملية. أعد المحاولة.", "err"); return finish(); }
    const j = await r.json();
    failures = 0;
    if (j.status === "queued") show("في قائمة الانتظار...");
    else if (j.status === "running") { show("جارٍ التنزيل... (" + j.count + " ملف)"); $("bar").hidden = false; }
    else if (j.status === "error") { show(j.message, "err"); return finish(); }
    else if (j.status === "done") {
      show(j.message, "ok");
      $("zip").href = "/api/jobs/" + id + "/zip";
      $("zip").textContent = "تحميل الكل (ZIP) - " + fmtSize(j.zip_size);
      $("zip").hidden = false;
      const ul = $("files");
      j.files.forEach((f) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = "/api/jobs/" + id + "/files/" + encodeURIComponent(f.name);
        a.textContent = f.name;
        const s = document.createElement("span");
        s.textContent = fmtSize(f.size);
        li.append(a, s);
        ul.append(li);
      });
      return finish();
    }
  } catch (_) {
    if (++failures >= 5) { show("انقطع الاتصال بالخادم.", "err"); return finish(); }
  }
  timer = setTimeout(() => poll(id), 1500);
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("go").disabled = true;
  $("files").replaceChildren();
  $("zip").hidden = true;
  show("جارٍ الإرسال...");
  try {
    const r = await fetch("/api/jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: $("username").value,
        kind: $("kind").value,
        limit: Number($("limit").value) || 50,
      }),
    });
    const j = await r.json();
    if (!r.ok) { show(j.error || "حدث خطأ.", "err"); return finish(); }
    failures = 0;
    poll(j.id);
  } catch (_) {
    show("تعذر الاتصال بالخادم.", "err");
    finish();
  }
});

health();
</script>
</body>
</html>
